name: Sync upstream SullyOS

on:
  schedule:
    - cron: '23 20 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: qegj567-cloud/SullyOS
  UPSTREAM_BRANCH: master
  CUSTOM_BRANCH: master
  MIRROR_BRANCH: upstream-mirror
  SYNC_BRANCH: automation/sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the custom branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CUSTOM_BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Update the read-only upstream mirror
        shell: bash
        run: |
          remote_tip="$(git ls-remote --heads origin "refs/heads/${MIRROR_BRANCH}" | cut -f1)"
          git push origin \
            --force-with-lease="refs/heads/${MIRROR_BRANCH}:${remote_tip}" \
            "upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"

      - name: Attempt a regular merge
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "${SYNC_BRANCH}" "origin/${CUSTOM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          git merge --abort
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          echo "Conflict files:"
          sed 's/^/ - /' "$RUNNER_TEMP/conflicts.txt"

      - name: Report merge conflicts
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conflict_list="$(sed 's/^/- `/' "$RUNNER_TEMP/conflicts.txt" | sed 's/$/`/')"
          body_file="$RUNNER_TEMP/conflict-issue.md"
          printf '%s\n\n%s\n\n%s\n%s\n' \
            'The scheduled upstream sync stopped because Git found real merge conflicts. No custom code was overwritten and no sync branch was pushed.' \
            "Upstream commit: \`$(git rev-parse "upstream/${UPSTREAM_BRANCH}")\`" \
            'Conflicting files:' "$conflict_list" > "$body_file"

          issue_number="$(gh issue list --state open --label upstream-sync-conflict --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh label create upstream-sync-conflict --color B60205 --description 'Upstream sync requires manual conflict resolution' --force
            gh issue create --title 'Upstream sync requires conflict resolution' --label upstream-sync-conflict --body-file "$body_file"
          fi
          exit 1

      - name: Install pnpm
        if: steps.merge.outputs.up_to_date != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: steps.merge.outputs.up_to_date != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.up_to_date != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test shortcut actions and data compatibility
        if: steps.merge.outputs.up_to_date != 'true'
        run: >-
          pnpm exec vitest run
          utils/shortcutActions.test.ts
          utils/characterCard.test.ts
          utils/backupRoundtrip.test.ts

      - name: Build merged code
        if: steps.merge.outputs.up_to_date != 'true'
        run: pnpm run build

      - name: Push the verified sync branch
        if: steps.merge.outputs.up_to_date != 'true'
        run: git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Open or update the sync pull request
        if: steps.merge.outputs.up_to_date != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --state open --head "${SYNC_BRANCH}" --base "${CUSTOM_BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr comment "$existing_pr" --body "Updated to upstream commit \`$(git rev-parse "upstream/${UPSTREAM_BRANCH}")\`; shortcut compatibility tests and the production build passed."
          else
            gh pr create \
              --base "${CUSTOM_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title 'chore: sync official SullyOS updates' \
              --body "Automated merge of \`${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}\`. Git found no conflicts; shortcut compatibility tests and \`pnpm run build\` passed. Review and merge this PR to update the custom release."
          fi
